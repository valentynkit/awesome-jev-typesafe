name: Suggest a project
description: Tell us about something built on Jev. A maintainer reads it against contributing.md and adds the line if it fits.
title: "Add <project name>"
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a project. Everything here is hand-reviewed, so a clear one-liner and a real repo are all we need. If you would rather open a pull request, add one line to readme.md in the format shown in contributing.md.
  - type: input
    id: url
    attributes:
      label: Repository or page URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One sentence, what it does
      description: Uppercase start, period end. Describe what it does, not what it is.
      placeholder: Routes each task to the cheapest model that can handle it.
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Official SDKs and framework support
        - Coding agents
        - Browser and computer use
        - Open models and replicas
        - Code review and quality
        - Routing and gateways
        - Search, reranking and RAG
        - Data and ops
        - Safety, moderation and verification
        - Applications and extensions
        - Games, robotics and simulation
        - Finance and trading
        - Benchmarks, evals and calibration
        - Playgrounds and demos
        - Command line
        - Community clients
        - Articles and talks
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: bar
    attributes:
      label: It meets the bar
      options:
        - label: It calls the Jev API, or is a documented replica of the System One interface on open models.
          required: true
        - label: It is public, has a readme that says what it does, and actually runs (no mocked Jev call, no hard-coded demo).
          required: true
        - label: It does nothing shady and is not already listed.
          required: true
